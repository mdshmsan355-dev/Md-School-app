name: Build Md School APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project
        run: unzip -q Md-School-ready-to-build.zip

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -n 3
          ls "$ANDROID_HOME/build-tools" | tail -n 3

      - name: Install dependencies
        working-directory: Md-School
        run: npm install

      - name: Build web app
        working-directory: Md-School
        run: npm run build

      - name: Prepare mobile build
        run: |
          cp build/mobile/index.html Md-School/index.html
          cp build/mobile/mobile-main.tsx Md-School/src/mobile-main.tsx
          cp build/mobile/vite.mobile.config.ts Md-School/vite.mobile.config.ts
          node -e "const fs=require('fs'); const p='Md-School/package.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); x.scripts={...x.scripts,'build:mobile':'vite build --config vite.mobile.config.ts'}; fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n')"
          sed -i 's/webDir: "[^"]*"/webDir: "mobile-dist"/' Md-School/capacitor.config.ts

      - name: Build mobile web bundle
        working-directory: Md-School
        run: npm run build:mobile

      - name: Add Android platform
        working-directory: Md-School
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: Md-School
        run: npx cap sync android

      - name: Build APK
        working-directory: Md-School/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Md-School-APK
          path: Md-School/android/app/build/outputs/apk/debug/app-debug.apk
